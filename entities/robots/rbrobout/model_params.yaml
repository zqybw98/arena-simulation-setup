# ===============================================================
# Robotnik RB-ROBOUT Model Parameters
# NOTE: This version EXCLUDES the RGBD cameras.
# ===============================================================

# ---------------------------------------------------------------
# Observation Sources
# This version is configured for dual LIDAR only.
# ---------------------------------------------------------------
observation_sources_string: front_laser rear_laser
observation_sources:
  - front_laser
  - rear_laser

observation_sources_dict:
  front_laser:
    topic: ${namespace}/front_laser
    max_obstacle_height: 2.0
    clearing: True
    marking: True
    data_type: "LaserScan"
  rear_laser:
    topic: ${namespace}/rear_laser
    max_obstacle_height: 2.0
    clearing: true
    marking: true
    data_type: "LaserScan"

# ---------------------------------------------------------------
# Robot Footprint
# Replaced with the precise footprint from the guide.
# ---------------------------------------------------------------
polygons:
  - StopPolygon
polygons_dict:
  StopPolygon:
    type: "polygon"
    points: "[ [0.2, 0.3], [0.2, -0.3], [-0.2, -0.3], [-0.2, 0.3] ]"
    action_type: "stop"
    min_points: 4

wheel_separation: 0.70     # approximate based on Kairos width (0.776 m)
wheels_per_side: 1
wheel_radius: 0.10         # placeholder


wheel_separation_multiplier: 1.5
left_wheel_radius_multiplier: 1.0
right_wheel_radius_multiplier: 1.0




publish_rate: 50.0
odom_frame_id: odom
pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]
twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]
robot_odom_frame: 'odom'


# ---------------------------------------------------------------
# Actions
# Updated continuous ranges based on new max velocities.
# ---------------------------------------------------------------
actions:
  continuous:
    angular_range: [-1.4, 1.4]
    linear_range: [-1.1, 1.1]
  discrete:
    - {name: move_forward, linear: 0.3, angular: 0.0}
    - {name: move_backward, linear: -0.3, angular: 0.0}
    - {name: turn_left, linear: 0.0, angular: 0.5}
    - {name: turn_right, linear: 0.0, angular: -0.5}
    - {name: stop, linear: 0.0, angular: 0.0}
is_holonomic: true  # Confirmed by the guide, RB-ROBOUT is omnidirectional


laser:
  angle:
    increment: 0.00872664626 # 270 deg / 1081 -> Check datasheet
    max: 2.35619449
    min: -2.35619449
  num_beams: 1081
  range: 25.0
  update_rate: 15 


# ---------------------------------------------------------------
# Odometry and Frames
# ---------------------------------------------------------------
robot_base_frame: robot_base_footprint
robot_model: rbrobout
robot_radius: 0.985 # Calculated from the new footprint corners
robot_sensor_frame: lidar
