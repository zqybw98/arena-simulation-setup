observation_sources_string: top_lidar front_camera
observation_sources:
  - top_lidar
  - front_camera

observation_sources_dict:
  # NOTE: The data type for a 3D LIDAR is PointCloud2
  top_lidar:
    topic: ${namespace}/top_lidar/
    max_obstacle_height: 2.0
    clearing: true
    marking: true
    data_type: "LaserScan"

  front_camera:
    topic: ${namespace}/front_camera/
    max_obstacle_height: 2.0
    clearing: true
    marking: true
    data_type: "Depth"
# ---------------------------------------------------------------
# Robot Footprint
# From the Deep Research Guide.
# ---------------------------------------------------------------
# footprint: "[[0.3655, 0.307], [0.3655, -0.307], [-0.3655, -0.307], [-0.3655, 0.307]]"
polygons:
  - StopPolygon
polygons_dict:
  StopPolygon:
    type: "polygon"
    points: "[ [0.2, 0.3], [0.2, -0.3], [-0.2, -0.3], [-0.2, 0.3] ]"
    action_type: "stop"
    min_points: 4

# ---------------------------------------------------------------
# Kinematics and Dynamics
# Derived from the guide's URDF analysis and motion recommendations.
# ---------------------------------------------------------------
track_width: 0.54      # (m) Lateral distance between wheels轮距
wheelbase: 0.45        # (m) Longitudinal distance between wheels轴距
wheel_radius: 0.095    # (m)车轮半径

# Recommended operational limits from the guide.
max_linear_velocity: 1.5   # (m/s)
max_angular_velocity: 1.0  # (rad/s)
max_linear_acceleration: 1.0 # (m/s^2)
max_angular_acceleration: 1.5 # (rad/s^2)

# ---------------------------------------------------------------
# Odometry and Frames
# ---------------------------------------------------------------
publish_rate: 50.0
odom_frame_id: odom
pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]
twist_covariance_diagonal: [0.001, 0.001, 0.001, 1000000.0, 1000000.0, 0.03]

# ---------------------------------------------------------------
# Actions
# Updated continuous ranges based on recommended operational velocities.
# ---------------------------------------------------------------
actions:
  continuous:
    linear_range: [-0.5, 1.5]
    angular_range: [-1.0, 1.0]
  discrete:
    - {name: move_forward, linear: 0.5, angular: 0.0}
    - {name: move_backward, linear: -0.5, angular: 0.0}
    - {name: turn_left, linear: 0.0, angular: 1.0}
    - {name: turn_right, linear: 0.0, angular: -1.0}
    - {name: stop, linear: 0.0, angular: 0.0}

# RB-SUMMIT uses Skid-Steering, which is non-holonomic.
is_holonomic: false

# ---------------------------------------------------------------
# Robot Model
# ---------------------------------------------------------------
robot_base_frame: robot_base_footprint
robot_model: rbsummit
robot_radius: 0.477 # (m) Calculated from the footprint corners
robot_sensor_frame: lidar
