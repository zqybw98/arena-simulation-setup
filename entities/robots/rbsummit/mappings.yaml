[
  ## COMMON
  # Odometry (Gazebo -> ROS2)
  {
    "gz_topic": "/model/{robot_name}/odometry",
    "ros_topic": "odom",
    "ros_type": "nav_msgs/msg/Odometry",
    "gz_type": "gz.msgs.Odometry",
    "direction": "[",
  },
  # IMU (Gazebo -> ROS2)
  {
    "gz_topic": "{world}/model/{robot_name}/imu_sensor/imu",
    "ros_topic": "imu/data",
    "ros_type": "sensor_msgs/msg/Imu",
    "gz_type": "gz.msgs.IMU",
    "direction": "[",
  },
  # Velocity command (ROS2 -> Gazebo)
  {
    "gz_topic": "/model/{robot_name}/cmd_vel",
    "ros_topic": "cmd_vel",
    "ros_type": "geometry_msgs/msg/Twist",
    "gz_type": "gz.msgs.Twist",
    "direction": "]",
  },
  # TF Data (Gazebo -> ROS2)
  {
    "gz_topic": "/model/{robot_name}/tf",
    "ros_topic": "/tf",
    "ros_type": "tf2_msgs/msg/TFMessage",
    "gz_type": "gz.msgs.Pose_V",
    "direction": "[",
  },
  {
    "gz_topic": "/model/{robot_name}/tf_static",
    "ros_topic": "/tf_static",
    "ros_type": "tf2_msgs/msg/TFMessage",
    "gz_type": "gz.msgs.Pose_V",
    "direction": "[",
  },
  # Joint states
  {
    "gz_topic": "/model/{robot_name}/joint_states",
    "ros_topic": "/joint_states",
    "ros_type": "sensor_msgs/msg/JointState",
    "gz_type": "gz.msgs.Model",
    "direction": "[",
  },

  ## top_lidar
  # 3D Lidar Point Cloud (Gazebo -> ROS2)
  # This maps the Robosense 3D Lidar data
  {
    "gz_topic": "/model/{robot_name}/robot_top_3d_laser_link/top_lidar/points",
    "ros_topic": "top_lidar/points",
    "ros_type": "sensor_msgs/msg/PointCloud2",
    "gz_type": "gz.msgs.PointCloudPacked",
    "direction": "[",
  },

  ## front_camera
  # Camera Info (Gazebo -> ROS2)
  {
    "gz_topic": "/model/{robot_name}/front_camera/color/camera_info",
    "ros_topic": "front_camera/camera_info",
    "ros_type": "sensor_msgs/msg/CameraInfo",
    "gz_type": "gz.msgs.CameraInfo",
    "direction": "[",
  },
  # Image (Gazebo -> ROS2)
  {
    "gz_topic": "/model/{robot_name}/front_camera/color/image",
    "ros_topic": "front_camera/image_raw",
    "ros_type": "sensor_msgs/msg/Image",
    "gz_type": "gz.msgs.Image",
    "direction": "[",
  },
  # Depth Image (Gazebo -> ROS2)
  {
    "gz_topic": "/model/{robot_name}/front_camera/depth/image",
    "ros_topic": "front_camera/depth/image_raw",
    "ros_type": "sensor_msgs/msg/Image",
    "gz_type": "gz.msgs.Image",
    "direction": "[",
  }
]
