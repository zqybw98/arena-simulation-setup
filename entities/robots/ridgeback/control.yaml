# ridgeback.control.yaml — templated like boxer.control.yaml

controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ridgeback_velocity_controller:
      type: diff_drive_controller/DiffDriveController

ridgeback_velocity_controller:
  ros__parameters:
    left_wheel_names:  ["front_left_wheel",  "rear_left_wheel"]
    right_wheel_names: ["front_right_wheel", "rear_right_wheel"]

    #  Physical geometry
    wheel_separation: 0.512      # [m]
    wheels_per_side: 2
    wheel_radius: 0.0759         # [m]
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    #  Frames & TF
    odom_frame_id: odom
    base_frame_id: base_link
    enable_odom_tf: true         # Keep as in your original; set false if another node publishes odom->base_link

    #  Publishing
    publish_rate: 50.0
    publish_cmd: true
    publish_wheel_data: true
    velocity_rolling_window_size: 10

    #  Estimation / mode
    estimate_velocity_from_position: false
    open_loop: false

    #  Low-level limits
    cmd_vel_timeout: 0.25
    preserve_turning_radius: true

    #  Covariances
    pose_covariance_diagonal:  [0.001, 0.001, 1e6, 1e6, 1e6, 0.03]
    twist_covariance_diagonal: [0.001, 0.001, 1e6, 1e6, 1e6, 0.03]

    #  Velocity & acceleration limits
    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 1.1        # Ridgeback nominal max speed
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 2.0

    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 1.0
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: 2.0
