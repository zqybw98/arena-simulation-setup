# control_rbtheron.yaml
# DiffDriveController setup for RB-THERON (ROS 2 control)
# Template adapted from rbkairos and rbtheron xacros.

controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    rbtheron_velocity_controller:
      type: diff_drive_controller/DiffDriveController

rbtheron_velocity_controller:
  ros__parameters:
    # --- Wheel joint names ---
    # RB-THERON is differential drive (2 drive wheels). The exact joint names
    # depend on the included base xacros. Common patterns to try:
    #   - "left_wheel_joint", "right_wheel_joint"
    #   - "robot_left_wheel_joint", "robot_right_wheel_joint"   # because prefix defaults to "robot_"
    #   - "left_drive_wheel_joint", "right_drive_wheel_joint"
    #
    # QUICK CHECK (after launching Gazebo): 
    #   ros2 topic echo /joint_states | grep -i wheel
    # or:
    #   ros2 control list_hardware_interfaces
    #
    left_wheel_names:  [ "front_left_wheel_joint", "rear_left_wheel_joint" ]      # <--- replace with the actual name(s)
    right_wheel_names: [ "front_right_wheel_joint", "rear_right_wheel_joint" ]    # <--- replace with the actual name(s)

    # --- Geometry (start with these and refine if needed) ---
    wheel_separation: 0.50          # m  (initial estimate; measure hub-to-hub)
    wheel_radius: 0.08              # m  (initial estimate; radius of drive tire)

    # Optional scaling multipliers (keep at 1.0 once separation/radius are correct)
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    # Frames / publishing
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal : [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]
    twist_covariance_diagonal: [1000000.0, 1000000.0, 0.03, 1000000.0, 1000000.0, 0.03]

    # Controller behavior
    open_loop: false           # use wheel feedback for odom if available
    enable_odom_tf: false      # let an external node (e.g., robot_state_publisher) handle TF if preferred
    cmd_vel_timeout: 0.25
    use_stamped_vel: false
    preserve_turning_radius: true

    publish_cmd: true
    publish_wheel_data: true

    # Limits (set conservatively; tune to spec)
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.has_jerk_limits: false
    linear.x.max_velocity: 1.3       # m/s (RB-THERON typical ballpark)
    linear.x.min_velocity: -1.3
    linear.x.max_acceleration: 8.0
    linear.x.min_acceleration: -8.0
    linear.x.max_jerk: 0.0
    linear.x.min_jerk: 0.0

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.has_jerk_limits: false
    angular.z.max_velocity: 3.0      # rad/s
    angular.z.min_velocity: -3.0
    angular.z.max_acceleration: 15.0
    angular.z.min_acceleration: -15.0
    angular.z.max_jerk: 0.0
    angular.z.min_jerk: 0.0
