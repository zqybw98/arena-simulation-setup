[
  ## COMMON
  # Odometry (Gazebo -> ROS2)
  {
    "gz_topic": "/model/{robot_name}/odometry",
    "ros_topic": "odom",
    "ros_type": "nav_msgs/msg/Odometry",
    "gz_type": "gz.msgs.Odometry",
    "direction": "["
  },

  # IMU (Gazebo -> ROS2)
  # Note: rbvogui uses a VectorNav IMU macro; keep this path unless your IMU macro
  # publishes under a different name.
  {
    "gz_topic": "{world}/model/{robot_name}/imu_sensor/imu",
    "ros_topic": "imu/data",
    "ros_type": "sensor_msgs/msg/Imu",
    "gz_type": "gz.msgs.IMU",
    "direction": "["
  },

  # Velocity command (ROS2 -> Gazebo)
  {
    "gz_topic": "/model/{robot_name}/cmd_vel",
    "ros_topic": "cmd_vel",
    "ros_type": "geometry_msgs/msg/Twist",
    "gz_type": "gz.msgs.Twist",
    "direction": "]"
  },

  # TF Data (Gazebo -> ROS2)
  {
    "gz_topic": "/model/{robot_name}/tf",
    "ros_topic": "/tf",
    "ros_type": "tf2_msgs/msg/TFMessage",
    "gz_type": "gz.msgs.Pose_V",
    "direction": "["
  },
  {
    "gz_topic": "/model/{robot_name}/tf_static",
    "ros_topic": "/tf_static",
    "ros_type": "tf2_msgs/msg/TFMessage",
    "gz_type": "gz.msgs.Pose_V",
    "direction": "["
  },

  # Joint states (Gazebo -> ROS2)
  {
    "gz_topic": "/model/{robot_name}/joint_states",
    "ros_topic": "/joint_states",
    "ros_type": "sensor_msgs/msg/JointState",
    "gz_type": "gz.msgs.Model",
    "direction": "["
  },

  ## front_laser (SICK S300) — from rbvogui URDF xacro (frame_prefix "robot_front_laser_")
  # LaserScan (Gazebo -> ROS2)
  {
    "gz_topic": "/model/{robot_name}/robot_front_laser_link/scan",
    "ros_topic": "front_laser",
    "ros_type": "sensor_msgs/msg/LaserScan",
    "gz_type": "gz.msgs.LaserScan",
    "direction": "["
  },
  # PointCloud2 (Gazebo -> ROS2)
  {
    "gz_topic": "/model/{robot_name}/robot_front_laser_link/scan/points",
    "ros_topic": "front_laser/points",
    "ros_type": "sensor_msgs/msg/PointCloud2",
    "gz_type": "gz.msgs.PointCloudPacked",
    "direction": "["
  },

  ## rear_laser (SICK S300) — from rbvogui URDF xacro (frame_prefix "robot_rear_laser_")
  # LaserScan (Gazebo -> ROS2)
  {
    "gz_topic": "/model/{robot_name}/robot_rear_laser_link/scan",
    "ros_topic": "rear_laser",
    "ros_type": "sensor_msgs/msg/LaserScan",
    "gz_type": "gz.msgs.LaserScan",
    "direction": "["
  },
  # PointCloud2 (Gazebo -> ROS2)
  {
    "gz_topic": "/model/{robot_name}/robot_rear_laser_link/scan/points",
    "ros_topic": "rear_laser/points",
    "ros_type": "sensor_msgs/msg/PointCloud2",
    "gz_type": "gz.msgs.PointCloudPacked",
    "direction": "["
  },

  ## RGB-D cameras (Intel RealSense D435) — node_name front_camera / rear_camera
  # FRONT camera — color stream (Gazebo -> ROS2)
  {
    "gz_topic": "/model/{robot_name}/front_camera_color/color/camera_info",
    "ros_topic": "front_camera_color/camera_info",
    "ros_type": "sensor_msgs/msg/CameraInfo",
    "gz_type": "gz.msgs.CameraInfo",
    "direction": "["
  },
  {
    "gz_topic": "/model/{robot_name}/front_camera_color/color/image_raw",
    "ros_topic": "front_camera_color/image_raw",
    "ros_type": "sensor_msgs/msg/Image",
    "gz_type": "gz.msgs.Image",
    "direction": "["
  },

  # REAR camera — color stream (Gazebo -> ROS2)
  {
    "gz_topic": "/model/{robot_name}/rear_camera_color/color/camera_info",
    "ros_topic": "rear_camera_color/camera_info",
    "ros_type": "sensor_msgs/msg/CameraInfo",
    "gz_type": "gz.msgs.CameraInfo",
    "direction": "["
  },
  {
    "gz_topic": "/model/{robot_name}/rear_camera_color/color/image_raw",
    "ros_topic": "rear_camera_color/image_raw",
    "ros_type": "sensor_msgs/msg/Image",
    "gz_type": "gz.msgs.Image",
    "direction": "["
  }
]
