# Model parameters for RB-VOGUI 
# (Derived from RB-VOGUI URDF and ROS2 configuration)
# RB-VOGUI is a 4-wheel drive mobile robot with front and rear Ackermann steering 
# and two 2D LIDAR scanners (front and rear):contentReference[oaicite:0]{index=0}.
 
observation_sources_string: front_laser rear_laser
observation_sources:
  - front_laser
  - rear_laser
observation_sources_dict:
  front_laser:  # Front 2D LIDAR (SICK S300 scanner) on front-left corner of chassis:contentReference[oaicite:1]{index=1}
    topic: ${namespace}/front_laser
    max_obstacle_height: 2.0
    clearing: true
    marking: true
    data_type: "LaserScan"
  rear_laser:   # Rear 2D LIDAR (SICK S300 scanner) on rear-right corner of chassis:contentReference[oaicite:2]{index=2}
    topic: ${namespace}/rear_laser
    max_obstacle_height: 2.0
    clearing: true
    marking: true
    data_type: LaserScan

polygons:
  - StopPolygon
polygons_dict:
  StopPolygon:
    type: "polygon"
    # Define a safety stop zone (approximately 1.0 x 0.7 m rectangle within base footprint):contentReference[oaicite:3]{index=3}
    points: "[ [0.5, 0.35], [0.5, -0.35], [-0.5, -0.35], [-0.5, 0.35] ]"
    action_type: "stop"
    min_points: 4

wheel_separation: 0.4745     # ~0.4745 m track width between wheels (≈0.2373 m each side):contentReference[oaicite:4]{index=4}
wheels_per_side: 2           # Two drive wheels per side (4WD Ackermann steering):contentReference[oaicite:5]{index=5}:contentReference[oaicite:6]{index=6}
wheel_radius: 0.1165         # Wheel radius ≈0.1165 m (0.233 m diameter per URDF):contentReference[oaicite:7]{index=7}

wheel_separation_multiplier: 1.0   # No scaling (Ackermann geometry uses true track width)
left_wheel_radius_multiplier: 1.0
right_wheel_radius_multiplier: 1.0

publish_rate: 50.0
odom_frame_id: odom
# base_frame_id: robot_base_link    # robot_base_link is the 3D center of robot (fixed to footprint)
pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]
twist_covariance_diagonal: [1000000.0, 1000000.0, 0.03, 1000000.0, 1000000.0, 0.03]

robot_odom_frame: 'odom'

actions:
  continuous:
    angular_range: [-0.3, 0.3]     # Max angular speed ~0.3 rad/s (limited by steering kinematics):contentReference[oaicite:8]{index=8}
    linear_range: [-0.3, 0.3]      # Max linear speed ~0.3 m/s (from base controller config):contentReference[oaicite:9]{index=9}
  discrete:
    - {name: move_forward,  linear: 0.3,  angular: 0.0}
    - {name: move_backward, linear: -0.3, angular: 0.0}
    - {name: turn_left,     linear: 0.0,  angular: 0.2}
    - {name: turn_right,    linear: 0.0,  angular: -0.2}
    - {name: stop,          linear: 0.0,  angular: 0.0}

is_holonomic: false   # RB-VOGUI uses dual Ackermann (front & rear wheel steering) kinematics:contentReference[oaicite:10]{index=10}

laser:
  angle:
    increment: 0.01687            # ~0.97° angular resolution per beam
    max: 2.26893                  # ~130° (forward-left):contentReference[oaicite:11]{index=11}
    min: -2.26893                 # ~-130° (back-right):contentReference[oaicite:12]{index=12}
  num_beams: 270                  # 270 beams (~260° total field of view per scanner):contentReference[oaicite:13]{index=13}
  range: 10.0                     # Max range ~10 m per scanner (SICK S300 spec):contentReference[oaicite:14]{index=14}
  update_rate: 25                 # Laser scans published at ~25 Hz:contentReference[oaicite:15]{index=15}

robot_base_frame: robot_base_footprint
robot_model: rbvogui
robot_radius: 0.53               # ~0.53 m (approx half of RB-VOGUI length):contentReference[oaicite:16]{index=16}
robot_sensor_frame: lidar
