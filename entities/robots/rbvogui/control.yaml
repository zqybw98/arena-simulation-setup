# control_rbvogui.yaml
# ROS 2 control for RB-VOGUI (4-wheel steering)
# Uses four_wheel_steering_controller for dual-axle steering bases.
# Docs: parameters & geometry concepts (track, wheelbase, radius).  See refs. 

controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    rbvogui_steering_controller:
      type: four_wheel_steering_controller/FourWheelSteeringController

rbvogui_steering_controller:
  ros__parameters:
    # === JOINT NAMES ===
    # Replace with actual joint names from /joint_states (prefix may be "robot_")
    # Common patterns:
    #   front wheel joints:  front_left_wheel_joint,  front_right_wheel_joint
    #   rear  wheel joints:  rear_left_wheel_joint,   rear_right_wheel_joint
    #   front steering:      front_left_steering_joint, front_right_steering_joint
    #   rear  steering:      rear_left_steering_joint,  rear_right_steering_joint
    #
    # If URDF prefixes names (e.g., "robot_front_left_wheel_joint"), use those.
    front_wheel_names:  ["front_left_wheel_joint",  "front_right_wheel_joint"]
    rear_wheel_names:   ["rear_left_wheel_joint",   "rear_right_wheel_joint"]
    front_steering:     ["front_left_steering_joint","front_right_steering_joint"]
    rear_steering:      ["rear_left_steering_joint", "rear_right_steering_joint"]

    # === GEOMETRY (initial values; refine after a short odom test) ===
    # track  = wheel separation left↔right (m)
    # wheelbase = distance front axle ↔ rear axle (m)
    track: 0.4745
    wheelbase: 0.90          # initial guess; measure axle-to-axle in URDF and update
    wheel_radius: 0.1165

    # If sim vs. real diverge, use multipliers (keep 1.0 once calibrated)
    track_multiplier: 1.0
    front_wheel_radius_multiplier: 1.0
    rear_wheel_radius_multiplier: 1.0

    # === FRAMES / ODOM ===
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link            # or robot_base_link / base_footprint if that’s your convention
    enable_odom_tf: false               # let your TF publisher handle it if preferred
    open_loop: false                    # use wheel feedback if available
    pose_covariance_diagonal : [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]
    twist_covariance_diagonal: [1000000.0, 1000000.0, 0.03, 1000000.0, 1000000.0, 0.03]

    # === COMMANDING ===
    cmd_vel_timeout: 0.25
    use_stamped_vel: false
    preserve_turning_radius: true
    allow_multiple_cmd_vel_publishers: false

    publish_cmd: true
    publish_wheel_data: true

    # === LIMITS (safe starting values; raise as needed) ===
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.max_velocity: 0.30
    linear.x.min_velocity: -0.30
    linear.x.max_acceleration: 1.0
    linear.x.min_acceleration: -1.0

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.max_velocity: 0.30
    angular.z.min_velocity: -0.30
    angular.z.max_acceleration: 1.0
    angular.z.min_acceleration: -1.0
